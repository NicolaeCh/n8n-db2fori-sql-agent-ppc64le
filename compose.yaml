services:
  n8n-db2-sql-agent:
    build:
      context: .
      dockerfile: Containerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: localhost/n8n-db2-sql-agent-ppc64le:${APP_VERSION:-1.0.0}
    platform: linux/ppc64le
    env_file:
      - .env
    ports:
      - "${SQL_AGENT_BIND_ADDRESS:-127.0.0.1}:${SQL_AGENT_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
